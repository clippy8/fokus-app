<div class="idea-row">
    {{ form.id }}
    {% if form.instance.pk %}<span style="display:none;">{{ form.DELETE }}</span>{% endif %}
    {% if form.non_field_errors %}
        <p style="color: var(--pico-del-color);">{{ form.non_field_errors|join:", " }}</p>
    {% endif %}
    {{ form.name }}
    {{ form.name.errors }}
    <button type="button" class="remove-idea-btn secondary">Entfernen</button>
</div>
