{% extends "base.html" %}

{% block title %}Meilenstein — Fokus App{% endblock %}

{% block content %}
<h1>Meilenstein — {{ ziel.title }}</h1>
{% if form.non_field_errors %}
    <p style="color: var(--pico-del-color);">{{ form.non_field_errors|join:", " }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Speichern</button>
    <a href="{% url 'goals:list' %}" role="button" class="secondary">Abbrechen</a>
</form>
{% endblock %}
