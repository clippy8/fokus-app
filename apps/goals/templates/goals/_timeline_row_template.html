<div class="timeline-row" data-row-id="">
    <div class="timeline-label">
        <strong class="row-title"></strong>
        <span class="status-badge status-not_started">Nicht begonnen</span>
    </div>
    <div class="timeline-track" style="width: {{ timeline_width_px }}px;">
        <div class="timeline-bar status-not_started" draggable="true" data-id="" data-start="" data-end="">
            <span class="resize-handle resize-left"></span>
            <span class="bar-label"></span>
            <span class="resize-handle resize-right"></span>
        </div>
    </div>
    <div class="manual-dates" data-id="">
        <label>Von <input type="date" class="manual-start"></label>
        <label>Bis <input type="date" class="manual-end"></label>
        <a class="edit-link" href="#">Bearbeiten</a>
    </div>
</div>
