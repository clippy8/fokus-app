{% extends "base.html" %}

{% block title %}Todo — Fokus App{% endblock %}

{% block content %}
<h1>{% if todo %}Todo bearbeiten{% else %}Neues Todo{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Speichern</button>
    <a href="{% url 'goals:todo-list' %}" role="button" class="secondary">Abbrechen</a>
</form>
{% endblock %}
