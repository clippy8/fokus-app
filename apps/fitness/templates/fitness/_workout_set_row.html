<div class="set-row">
    {{ form.id }}
    {% if form.instance.pk %}<span style="display:none;">{{ form.DELETE }}</span>{% endif %}
    {% if form.non_field_errors %}
        <p style="color: var(--pico-del-color);">{{ form.non_field_errors|join:", " }}</p>
    {% endif %}
    <div class="grid">
        <label>Wiederholungen {{ form.reps }}</label>
        <label>Gewicht (kg) {{ form.weight_kg }}</label>
    </div>
    <button type="button" class="remove-set-btn secondary">Entfernen</button>
    <hr>
</div>
